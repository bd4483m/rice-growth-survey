<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水稲生育調査</title><style>
body{font-family:-apple-system,sans-serif;background:#f4f6f2;margin:0;color:#172018}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}button{font:inherit;border:0;border-radius:13px;padding:15px;font-weight:700}.mode,.main{width:100%;font-size:19px;background:#176b37;color:#fff;margin:6px 0;text-align:left}.mode small{display:block;font-weight:400;margin-top:4px}.stop{width:100%;margin-top:8px;background:#8b3030;color:#fff}.next{width:100%;font-size:19px;background:#245a8d;color:#fff;margin-top:12px}.back,.menu{width:100%;background:#e4e8e3;margin-top:8px}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#eef3ed;text-align:left;min-height:70px}.item.edited{outline:3px solid #176b37}.missing{background:#fff8e9}.no{display:block;font-size:13px}.val{font-size:27px}.note{display:block;font-size:12px;color:#176b37}.raw{background:#f1f3f0;padding:11px;border-radius:10px;min-height:38px}.step,.done{font-weight:700;color:#176b37}.progress{height:8px;background:#dfe5de;border-radius:10px;overflow:hidden}.bar{height:100%;background:#176b37}#survey,#editor{display:none}#editor{position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.sheet{width:100%;background:#fff;padding:20px;box-sizing:border-box}.sheet input{width:100%;box-sizing:border-box;font-size:30px;padding:13px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{background:#176b37;color:#fff}.choiceRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.choice{background:#e4e8e3;min-width:58px}.choice.selected{background:#176b37;color:#fff}label{display:block;font-weight:700;margin-top:14px}input,select{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:12px;margin-top:6px;border:1px solid #bcc7bc;border-radius:10px;background:#fff}.hint{font-size:13px;color:#566057}.meta{background:#eef3ed;padding:11px;border-radius:10px;line-height:1.7}
</style></head><body><main><h1>🌾 水稲生育調査</h1>
<section id="select"><div class="card"><h2>基本情報</h2>
<label>調査日<input id="surveyDate" type="date"></label>

<label>圃場名<input id="fieldName" type="text" placeholder="例：A圃場・試験区・1反復目"></label>
<label>品種<input id="cultivar" type="text" placeholder="例：コシヒカリ"></label>
<label>10株間の長さ（cm・任意）
<input id="tenPlantLength" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="例：180">
</label>
<p class="hint">㎡当たり茎数・穂数の計算に使用します。必要な調査時だけ入力してください。</p>
<div id="gasBox" style="display:none"><label>ガス湧き程度</label><div class="choiceRow" id="gasChoices"><button type="button" class="choice" data-value="多">多</button><button type="button" class="choice" data-value="少">少</button><button type="button" class="choice" data-value="無">無</button></div></div><div id="lodgingBox" style="display:none"><label>倒伏程度</label><div class="choiceRow" id="lodgingChoices"><button type="button" class="choice" data-value="0">0</button><button type="button" class="choice" data-value="1">1</button><button type="button" class="choice" data-value="2">2</button><button type="button" class="choice" data-value="3">3</button><button type="button" class="choice" data-value="4">4</button><button type="button" class="choice" data-value="5">5</button><button type="button" class="choice" data-value="6">6</button></div></div><label>調査内容<select id="surveyType"><option value="">選択してください</option><option value="d30">田植え30日後</option><option value="d40">田植え40日後</option><option value="d50">田植え50日後</option><option value="h24">出穂24日前</option><option value="h18">出穂18日前</option><option value="mature">成熟期</option><option value="other">その他</option></select></label>
<div id="otherBox" style="display:none"><p class="hint">「その他」の場合は測定項目を選択してください。</p><label><input class="otherItem" type="checkbox" value="height" style="width:auto"> 草丈</label><label><input class="otherItem" type="checkbox" value="tiller" style="width:auto"> 茎数</label><label><input class="otherItem" type="checkbox" value="leaf" style="width:auto"> 葉色</label><label><input class="otherItem" type="checkbox" value="culm" style="width:auto"> 稈長</label><label><input class="otherItem" type="checkbox" value="plen" style="width:auto"> 穂長</label><label><input class="otherItem" type="checkbox" value="pcount" style="width:auto"> 穂数</label></div>
<button id="begin" class="main" style="margin-top:20px">この内容で調査を開始 →</button><p id="formErr" style="color:#8b3030"></p></div></section>
<section id="survey"><div class="card"><b>今回の調査</b><div id="metaSummary" class="meta"></div></div><p id="modeName"></p><p id="step" class="step"></p><div class="progress"><div id="bar" class="bar"></div></div><h2 id="title"></h2><div class="card"><b id="support">確認中…</b><p id="state">待機中</p><button id="start" class="main">🎤 10株を音声入力</button><button id="stop" class="stop" disabled>■ 停止</button><p>誤認識した値はタップして修正できます。手修正した値は、その後も音声入力を続けても保持されます。</p></div><div class="card"><b>入力結果</b><p id="count"></p><p id="average" class="done"></p><p id="density" class="done"></p><div id="grid" class="grid"></div><button id="next" class="next" disabled></button><button id="back" class="back" style="display:none"></button><p id="done" class="done"></p>
<button id="addRow" class="main" style="display:none">＋ この調査区をCSVに追加</button>
<button id="nextPlot" class="next" style="display:none">次の調査区を入力 →</button>
<button id="downloadCsv" class="back" style="display:none">CSVを保存</button>
<p id="csvCount" class="done"></p>
<button id="menu" class="menu">基本情報に戻る</button></div><div class="card"><b>認識した文章（確認用）</b><div id="raw" class="raw">まだ認識していません</div><p id="err"></p></div></section></main>
<div id="editor"><div class="sheet"><b id="editTitle"></b><input id="editInput" inputmode="decimal" type="number" min="0" max="999.9" step="0.1"><div class="actions"><button id="cancel">キャンセル</button><button class="save" id="save">この値に修正</button></div></div></div>
<script>
const $=x=>document.getElementById(x),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const all={height:{name:'草丈',unit:'cm'},tiller:{name:'茎数',unit:'本'},leaf:{name:'葉色',unit:''},culm:{name:'稈長',unit:'cm'},plen:{name:'穂長',unit:'cm'},pcount:{name:'穂数',unit:'本'}};
const modes={d30:{name:'田植え30日後',keys:['height','tiller','leaf']},d40:{name:'田植え40日後',keys:['height','tiller','leaf']},d50:{name:'田植え50日後',keys:['height','tiller','leaf']},h24:{name:'出穂24日前',keys:['leaf']},h18:{name:'出穂18日前',keys:['leaf']},mature:{name:'成熟期',keys:['culm','plen','pcount']},other:{name:'その他',keys:[]}};
let data={},raws={},locked={};Object.keys(all).forEach(k=>{data[k]=Array(10).fill(null);raws[k]='';locked[k]=Array(10).fill(false)});let active=[],idx=0,rec=null,finalText='',editing=-1,currentKey=null,gasValue='',lodgingValue='',records=[];
const key=()=>active[idx], item=()=>all[key()];function parse(t){return(t.replace(/[，、]/g,',').match(/\d+(?:\.\d+)?/g)||[]).slice(0,10).map(Number)}
$('surveyDate').value=new Date().toLocaleDateString('sv-SE');$('surveyType').onchange=()=>{let t=$('surveyType').value;$('otherBox').style.display=t==='other'?'block':'none';$('gasBox').style.display=t==='d30'?'block':'none';$('lodgingBox').style.display=t==='mature'?'block':'none'};document.querySelectorAll('#gasChoices .choice').forEach(b=>b.onclick=()=>{gasValue=b.dataset.value;document.querySelectorAll('#gasChoices .choice').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('#lodgingChoices .choice').forEach(b=>b.onclick=()=>{lodgingValue=b.dataset.value;document.querySelectorAll('#lodgingChoices .choice').forEach(x=>x.classList.toggle('selected',x===b))});$('begin').onclick=()=>{let m=$('surveyType').value,missing=[];if(!$('surveyDate').value)missing.push('調査日');if(!$('fieldName').value.trim())missing.push('圃場名');if(!$('cultivar').value.trim())missing.push('品種');if(!m)missing.push('調査内容');if(missing.length){$('formErr').textContent='未入力：'+missing.join('、');return}active=m==='other'?[...document.querySelectorAll('.otherItem:checked')].map(x=>x.value):modes[m].keys.slice();if(!active.length){$('formErr').textContent='測定項目を1つ以上選んでください。';return}$('formErr').textContent='';Object.keys(all).forEach(k=>{data[k]=Array(10).fill(null);raws[k]='';locked[k]=Array(10).fill(false)});idx=0;currentKey=key();$('select').style.display='none';$('survey').style.display='block';$('modeName').textContent='調査内容： '+modes[m].name;$('metaSummary').innerHTML='調査日：'+$('surveyDate').value+'<br>圃場名：'+$('fieldName').value.trim()+'<br>品種：'+$('cultivar').value+'<br>10株間の長さ：'+($('tenPlantLength').value?$('tenPlantLength').value+' cm':'未入力')+(m==='d30'&&gasValue?'<br>ガス湧き程度：'+gasValue:'')+(m==='mature'&&lodgingValue!==''?'<br>倒伏程度：'+lodgingValue:'');$('state').textContent='待機中';$('done').textContent='';render()};
function render(){let k=key(),it=item();$('step').textContent=(idx+1)+' / '+active.length+' 項目';$('bar').style.width=((idx+1)/active.length*100)+'%';$('title').textContent=it.name+(it.unit?'（'+it.unit+'）':'')+'・10株';$('grid').innerHTML='';data[k].forEach((v,i)=>{let b=document.createElement('button');b.className='item'+(v===null?' missing':'')+(locked[k][i]?' edited':'');b.innerHTML='<span class="no">'+(i+1)+'株目</span><span class="val">'+(v===null?'未入力':v+(it.unit?' '+it.unit:''))+'</span>'+(locked[k][i]?'<span class="note">手修正済み</span>':'');b.onclick=()=>edit(i);$('grid').appendChild(b)});let vals=data[k].filter(v=>v!==null),n=vals.length;$('count').textContent=n+' / 10 株';
let avg=n===10?vals.reduce((a,b)=>a+b,0)/10:null;
$('average').textContent=n===10?'10株平均：'+avg.toFixed(1)+(it.unit?' '+it.unit:''):'10株平均：10株入力後に表示';
let L=Number($('tenPlantLength').value);
if(k==='tiller'||k==='pcount'){
  if(n<10)$('density').textContent='㎡当たり'+it.name+'：10株入力後に表示';
  else if(!L||L<=0)$('density').textContent='㎡当たり'+it.name+'：10株間の長さを入力してください';
  else $('density').textContent='㎡当たり'+it.name+'：'+Math.round(avg/L/0.3*1000)+' 本/㎡';
}else $('density').textContent='';
$('next').disabled=n<10;$('next').textContent=idx<active.length-1?'入力を確認して '+all[active[idx+1]].name+'へ →':'今回の調査を完了 ✓';$('back').style.display=idx>0?'block':'none';if(idx>0)$('back').textContent='← '+all[active[idx-1]].name+'に戻る';$('raw').textContent=raws[k]||'まだ認識していません'}
function edit(i){editing=i;$('editTitle').textContent=item().name+' '+(i+1)+'株目を修正';$('editInput').value=data[key()][i]??'';$('editor').style.display='flex';setTimeout(()=>$('editInput').focus(),100)}
$('cancel').onclick=()=>$('editor').style.display='none';$('save').onclick=()=>{let s=$('editInput').value,x=Number(s),k=key();if(s!==''&&x>=0&&x<=999.9){data[k][editing]=Math.round(x*10)/10;locked[k][editing]=true;$('editor').style.display='none';render()}else alert('0～999.9の数値を入力してください。')};
$('next').onclick=()=>{if(idx<active.length-1){idx++;currentKey=key();$('state').textContent='待機中';$('done').textContent='';render()}else{$('state').textContent='✓ 今回の調査が完了しました';$('done').textContent=active.map(k=>all[k].name).join('・')+' の入力が完了しました。';$('addRow').style.display='block'}};$('back').onclick=()=>{if(idx>0){idx--;currentKey=key();$('state').textContent='待機中';render()}};
function mean(k){let a=data[k].filter(v=>v!==null);return a.length===10?a.reduce((x,y)=>x+y,0)/10:null}
function csvEscape(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function makeRecord(){
 let r={調査日:$('surveyDate').value,圃場名:$('fieldName').value.trim(),品種:$('cultivar').value.trim(),調査内容:$('surveyType').options[$('surveyType').selectedIndex].text,十株間長:$('tenPlantLength').value,ガス湧き程度:$('surveyType').value==='d30'?gasValue:'',倒伏程度:$('surveyType').value==='mature'?lodgingValue:''};
 for(let k of Object.keys(all)){for(let i=0;i<10;i++)r[all[k].name+(i+1)]=data[k][i]??'';let a=mean(k);r[all[k].name+'平均']=a===null?'':a.toFixed(1)}
 let L=Number($('tenPlantLength').value),ta=mean('tiller'),pa=mean('pcount');
 r['㎡当たり茎数']=L>0&&ta!==null?Math.round(ta/L/0.3*1000):'';
 r['㎡当たり穂数']=L>0&&pa!==null?Math.round(pa/L/0.3*1000):'';
 return r
}
function updateCsvUI(){$('csvCount').textContent=records.length?'CSV追加済み：'+records.length+'調査区':'';$('downloadCsv').style.display=records.length?'block':'none'}
$('addRow').onclick=()=>{records.push(makeRecord());$('addRow').style.display='none';$('nextPlot').style.display='block';updateCsvUI()};
$('nextPlot').onclick=()=>{resetMeasurements();idx=0;currentKey=key();$('survey').style.display='none';$('select').style.display='block';$('fieldName').focus();$('done').textContent='';$('nextPlot').style.display='none';$('addRow').style.display='none';$('state').textContent='待機中'};
$('downloadCsv').onclick=()=>{
 if(!records.length)return;
 let headers=Object.keys(records[0]),lines=[headers.map(csvEscape).join(',')];
 for(let r of records)lines.push(headers.map(h=>csvEscape(r[h])).join(','));
 let blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='水稲生育調査_'+($('surveyDate').value||'data')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
};
$('menu').onclick=()=>{try{rec&&rec.stop()}catch(e){}$('survey').style.display='none';$('select').style.display='block'};
if(!SR){$('support').textContent='✕ 音声認識を利用できません';$('start').disabled=true}else{$('support').textContent='✓ 音声認識を利用できます';rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=true;rec.onstart=()=>{$('state').textContent='🎙 '+item().name+'を認識中';$('start').disabled=true;$('stop').disabled=false};rec.onresult=e=>{let inter='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else inter+=t}let s=(finalText+inter).trim(),k=currentKey;raws[k]=s;let a=parse(s);for(let i=0;i<10;i++)if(!locked[k][i])data[k][i]=i<a.length?a[i]:null;render();if(a.length>=10){$('state').textContent='✓ 10株入力。結果を確認してください';try{rec.stop()}catch(x){}}};rec.onerror=e=>{$('err').textContent='音声認識エラー: '+e.error;$('state').textContent='エラー'};rec.onend=()=>{$('start').disabled=false;$('stop').disabled=true};$('start').onclick=()=>{let k=key();currentKey=k;for(let i=0;i<10;i++)if(!locked[k][i])data[k][i]=null;raws[k]='';finalText='';$('err').textContent='';render();try{rec.start()}catch(e){$('err').textContent=e.message}};$('stop').onclick=()=>{try{rec.stop()}catch(e){}}}
</script></body></html>
