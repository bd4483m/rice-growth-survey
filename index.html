<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水稲生育調査</title>
<style>body{font-family:-apple-system,sans-serif;background:#f4f6f2;margin:0;color:#172018}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}button{font:inherit;border:0;border-radius:13px;padding:15px;font-weight:700}.main{width:100%;font-size:20px;background:#176b37;color:#fff}.stop{width:100%;margin-top:8px;background:#8b3030;color:#fff}.next{width:100%;font-size:19px;background:#245a8d;color:#fff;margin-top:12px}.back{width:100%;background:#e4e8e3;margin-top:8px}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#eef3ed;text-align:left;min-height:70px}.missing{background:#fff8e9}.no{display:block;font-size:13px}.val{font-size:27px}.raw{background:#f1f3f0;padding:11px;border-radius:10px;min-height:38px}.step{font-weight:700;color:#176b37}#editor{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.sheet{width:100%;background:#fff;padding:20px;box-sizing:border-box}.sheet input{width:100%;box-sizing:border-box;font-size:30px;padding:13px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{background:#176b37;color:#fff}</style></head><body><main>
<h1>🌾 水稲生育調査</h1><p id="step" class="step"></p><h2 id="title"></h2>
<div class="card"><b id="support">確認中…</b><p id="state">待機中</p><button id="start" class="main">🎤 10株を音声入力</button><button id="stop" class="stop" disabled>■ 停止</button><p>誤認識した値はタップして修正できます。</p></div>
<div class="card"><b>入力結果</b><p id="count"></p><div id="grid" class="grid"></div><button id="next" class="next" disabled>入力を確認して次へ →</button><button id="back" class="back" style="display:none">← 草丈に戻る</button></div>
<div class="card"><b>認識した文章（確認用）</b><div id="raw" class="raw">まだ認識していません</div><p id="err"></p></div></main>
<div id="editor"><div class="sheet"><b id="editTitle"></b><input id="editInput" inputmode="decimal" type="number" min="0" max="999.9" step="0.1"><div class="actions"><button id="cancel">キャンセル</button><button class="save" id="save">この値に修正</button></div></div></div>
<script>
const $=x=>document.getElementById(x),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const items=[{name:"草丈",unit:"cm"},{name:"茎数",unit:"本"}];
let data=[Array(10).fill(null),Array(10).fill(null)],raws=["",""],idx=0,rec=null,finalText="",editing=-1;
function parse(t){return (t.replace(/[，、]/g,",").match(/\d+(?:\.\d+)?/g)||[]).slice(0,10).map(Number)}
function render(){
 $("step").textContent=(idx+1)+" / 2 項目";$("title").textContent=items[idx].name+"（"+items[idx].unit+"）・10株";
 $("grid").innerHTML="";data[idx].forEach((v,i)=>{let b=document.createElement("button");b.className="item"+(v===null?" missing":"");b.innerHTML='<span class="no">'+(i+1)+'株目</span><span class="val">'+(v===null?"未入力":v+" "+items[idx].unit)+"</span>";b.onclick=()=>edit(i);$("grid").appendChild(b)});
 let n=data[idx].filter(v=>v!==null).length;$("count").textContent=n+" / 10 株";$("next").disabled=n<10;$("next").textContent=idx===0?"入力を確認して茎数へ →":"草丈・茎数の入力完了 ✓";$("back").style.display=idx===1?"block":"none";$("raw").textContent=raws[idx]||"まだ認識していません";
}
function edit(i){editing=i;$("editTitle").textContent=items[idx].name+" "+(i+1)+"株目を修正";$("editInput").value=data[idx][i]??"";$("editor").style.display="flex";setTimeout(()=>$("editInput").focus(),100)}
$("cancel").onclick=()=>$("editor").style.display="none";
$("save").onclick=()=>{let s=$("editInput").value,x=Number(s);if(s!==""&&x>=0&&x<=999.9){data[idx][editing]=Math.round(x*10)/10;$("editor").style.display="none";render()}else alert("0～999.9の数値を入力してください。")};
$("next").onclick=()=>{if(idx===0){idx=1;$("state").textContent="待機中";render()}else{$("state").textContent="✓ 草丈・茎数の入力が完了しました"}};
$("back").onclick=()=>{idx=0;$("state").textContent="待機中";render()};
render();
if(!SR){$("support").textContent="✕ 音声認識を利用できません";$("start").disabled=true}else{$("support").textContent="✓ 音声認識を利用できます";rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.continuous=true;
rec.onstart=()=>{$("state").textContent="🎙 "+items[idx].name+"を認識中";$("start").disabled=true;$("stop").disabled=false};
rec.onresult=e=>{let inter="";for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+" ";else inter+=t}let s=(finalText+inter).trim();raws[idx]=s;let a=parse(s);data[idx]=Array(10).fill(null);a.forEach((v,i)=>data[idx][i]=v);render();if(a.length>=10){$("state").textContent="✓ 10株入力。結果を確認してください";try{rec.stop()}catch(x){}}};
rec.onerror=e=>{$("err").textContent="音声認識エラー: "+e.error;$("state").textContent="エラー"};
rec.onend=()=>{$("start").disabled=false;$("stop").disabled=true};
$("start").onclick=()=>{data[idx]=Array(10).fill(null);raws[idx]="";render();finalText="";$("err").textContent="";try{rec.start()}catch(e){$("err").textContent=e.message}};
$("stop").onclick=()=>{try{rec.stop()}catch(e){}}}
</script></body></html>
