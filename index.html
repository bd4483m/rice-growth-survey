<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水稲生育調査</title><style>
body{font-family:-apple-system,sans-serif;background:#f4f6f2;margin:0;color:#172018}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}button{font:inherit;border:0;border-radius:13px;padding:15px;font-weight:700}.mode,.main{width:100%;font-size:19px;background:#176b37;color:#fff;margin:6px 0;text-align:left}.mode small{display:block;font-weight:400;margin-top:4px}.stop{width:100%;margin-top:8px;background:#8b3030;color:#fff}.next{width:100%;font-size:19px;background:#245a8d;color:#fff;margin-top:12px}.back,.menu{width:100%;background:#e4e8e3;margin-top:8px}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#eef3ed;text-align:left;min-height:70px}.item.edited{outline:3px solid #176b37}.missing{background:#fff8e9}.no{display:block;font-size:13px}.val{font-size:27px}.note{display:block;font-size:12px;color:#176b37}.raw{background:#f1f3f0;padding:11px;border-radius:10px;min-height:38px}.step,.done{font-weight:700;color:#176b37}.progress{height:8px;background:#dfe5de;border-radius:10px;overflow:hidden}.bar{height:100%;background:#176b37}#survey,#editor{display:none}#editor{position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.sheet{width:100%;background:#fff;padding:20px;box-sizing:border-box}.sheet input{width:100%;box-sizing:border-box;font-size:30px;padding:13px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{background:#176b37;color:#fff}
</style></head><body><main><h1>🌾 水稲生育調査</h1>
<section id="select"><div class="card"><h2>今回の調査を選択</h2><button class="mode" onclick="startMode('pre')">出穂前の生育調査<small>草丈・茎数・葉色　各10株</small></button><button class="mode" onclick="startMode('leaf')">葉色のみ<small>葉色　10株</small></button><button class="mode" onclick="startMode('post')">成熟期調査<small>稈長・穂長・穂数　各10株</small></button></div></section>
<section id="survey"><p id="modeName"></p><p id="step" class="step"></p><div class="progress"><div id="bar" class="bar"></div></div><h2 id="title"></h2><div class="card"><b id="support">確認中…</b><p id="state">待機中</p><button id="start" class="main">🎤 10株を音声入力</button><button id="stop" class="stop" disabled>■ 停止</button><p>誤認識した値はタップして修正できます。手修正した値は、その後も音声入力を続けても保持されます。</p></div><div class="card"><b>入力結果</b><p id="count"></p><div id="grid" class="grid"></div><button id="next" class="next" disabled></button><button id="back" class="back" style="display:none"></button><p id="done" class="done"></p><button id="menu" class="menu">調査選択に戻る</button></div><div class="card"><b>認識した文章（確認用）</b><div id="raw" class="raw">まだ認識していません</div><p id="err"></p></div></section></main>
<div id="editor"><div class="sheet"><b id="editTitle"></b><input id="editInput" inputmode="decimal" type="number" min="0" max="999.9" step="0.1"><div class="actions"><button id="cancel">キャンセル</button><button class="save" id="save">この値に修正</button></div></div></div>
<script>
const $=x=>document.getElementById(x),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const all={height:{name:'草丈',unit:'cm'},tiller:{name:'茎数',unit:'本'},leaf:{name:'葉色',unit:''},culm:{name:'稈長',unit:'cm'},plen:{name:'穂長',unit:'cm'},pcount:{name:'穂数',unit:'本'}};
const modes={pre:{name:'出穂前の生育調査',keys:['height','tiller','leaf']},leaf:{name:'葉色のみ',keys:['leaf']},post:{name:'成熟期調査',keys:['culm','plen','pcount']}};
let data={},raws={},locked={};Object.keys(all).forEach(k=>{data[k]=Array(10).fill(null);raws[k]='';locked[k]=Array(10).fill(false)});let active=[],idx=0,rec=null,finalText='',editing=-1,currentKey=null;
const key=()=>active[idx], item=()=>all[key()];function parse(t){return(t.replace(/[，、]/g,',').match(/\d+(?:\.\d+)?/g)||[]).slice(0,10).map(Number)}
window.startMode=m=>{active=modes[m].keys.slice();idx=0;currentKey=key();$('select').style.display='none';$('survey').style.display='block';$('modeName').textContent='今回： '+modes[m].name;$('state').textContent='待機中';render()};
function render(){let k=key(),it=item();$('step').textContent=(idx+1)+' / '+active.length+' 項目';$('bar').style.width=((idx+1)/active.length*100)+'%';$('title').textContent=it.name+(it.unit?'（'+it.unit+'）':'')+'・10株';$('grid').innerHTML='';data[k].forEach((v,i)=>{let b=document.createElement('button');b.className='item'+(v===null?' missing':'')+(locked[k][i]?' edited':'');b.innerHTML='<span class="no">'+(i+1)+'株目</span><span class="val">'+(v===null?'未入力':v+(it.unit?' '+it.unit:''))+'</span>'+(locked[k][i]?'<span class="note">手修正済み</span>':'');b.onclick=()=>edit(i);$('grid').appendChild(b)});let n=data[k].filter(v=>v!==null).length;$('count').textContent=n+' / 10 株';$('next').disabled=n<10;$('next').textContent=idx<active.length-1?'入力を確認して '+all[active[idx+1]].name+'へ →':'今回の調査を完了 ✓';$('back').style.display=idx>0?'block':'none';if(idx>0)$('back').textContent='← '+all[active[idx-1]].name+'に戻る';$('raw').textContent=raws[k]||'まだ認識していません'}
function edit(i){editing=i;$('editTitle').textContent=item().name+' '+(i+1)+'株目を修正';$('editInput').value=data[key()][i]??'';$('editor').style.display='flex';setTimeout(()=>$('editInput').focus(),100)}
$('cancel').onclick=()=>$('editor').style.display='none';$('save').onclick=()=>{let s=$('editInput').value,x=Number(s),k=key();if(s!==''&&x>=0&&x<=999.9){data[k][editing]=Math.round(x*10)/10;locked[k][editing]=true;$('editor').style.display='none';render()}else alert('0～999.9の数値を入力してください。')};
$('next').onclick=()=>{if(idx<active.length-1){idx++;currentKey=key();$('state').textContent='待機中';$('done').textContent='';render()}else{$('state').textContent='✓ 今回の調査が完了しました';$('done').textContent=active.map(k=>all[k].name).join('・')+' の入力が完了しました。'}};$('back').onclick=()=>{if(idx>0){idx--;currentKey=key();$('state').textContent='待機中';render()}};$('menu').onclick=()=>{try{rec&&rec.stop()}catch(e){}$('survey').style.display='none';$('select').style.display='block'};
if(!SR){$('support').textContent='✕ 音声認識を利用できません';$('start').disabled=true}else{$('support').textContent='✓ 音声認識を利用できます';rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=true;rec.onstart=()=>{$('state').textContent='🎙 '+item().name+'を認識中';$('start').disabled=true;$('stop').disabled=false};rec.onresult=e=>{let inter='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else inter+=t}let s=(finalText+inter).trim(),k=currentKey;raws[k]=s;let a=parse(s);for(let i=0;i<10;i++)if(!locked[k][i])data[k][i]=i<a.length?a[i]:null;render();if(a.length>=10){$('state').textContent='✓ 10株入力。結果を確認してください';try{rec.stop()}catch(x){}}};rec.onerror=e=>{$('err').textContent='音声認識エラー: '+e.error;$('state').textContent='エラー'};rec.onend=()=>{$('start').disabled=false;$('stop').disabled=true};$('start').onclick=()=>{let k=key();currentKey=k;for(let i=0;i<10;i++)if(!locked[k][i])data[k][i]=null;raws[k]='';finalText='';$('err').textContent='';render();try{rec.start()}catch(e){$('err').textContent=e.message}};$('stop').onclick=()=>{try{rec.stop()}catch(e){}}}
</script></body></html>
